name: Scheduled Scrape & Maintenance

on:
  schedule:
    # Run daily at 06:00 JST (21:00 UTC)
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Self-Enable Workflow (Prevent 60-day GitHub Actions suspension)
        run: |
          echo "🔄 Ensuring Scheduled Scrape & Maintenance workflow stays enabled..."
          gh api --method PUT /repos/${{ github.repository }}/actions/workflows/cron.yml/enable || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ghostscript webp

      - name: Trigger scrape
        id: scrape_step
        run: |
          echo "🎵 Triggering daily scrape..."
          response=$(curl -s -w "\n%{http_code}" -X POST \
            "https://ken-gei-prelude.pages.dev/api/cron/scrape" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")
          
          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | sed '$d')
          
          echo "HTTP Status: $http_code"
          echo "Response: $body"
          echo "scrape_status=$http_code" >> "$GITHUB_OUTPUT"
          
          if [ "$http_code" != "200" ]; then
            echo "::warning::Scrape returned non-200 status"
          fi

      - name: Trigger maintenance
        run: |
          echo "🔧 Triggering daily maintenance..."
          response=$(curl -s -w "\n%{http_code}" -X POST \
            "https://ken-gei-prelude.pages.dev/api/cron/maintenance" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")
          
          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | sed '$d')
          
          echo "HTTP Status: $http_code"
          echo "Response: $body"

      - name: Backfill PDF flyers
        run: |
          echo "🖼️ Backfilling PDF flyers..."
          if npm run backfill:pdf-flyers -- --limit=200; then
            echo "✅ PDF backfill completed"
          else
            echo "::warning::PDF backfill failed (likely Cloudflare auth/scope mismatch). Continuing scheduled maintenance."
          fi

      - name: Zero-Touch Keepalive Heartbeat (Reset 60-day inactivity clock)
        run: |
          last_commit_epoch=$(git log -1 --format=%ct || echo 0)
          now_epoch=$(date -u +%s)
          days_since=$(( (now_epoch - last_commit_epoch) / 86400 ))
          echo "Days since last commit: ${days_since}d"
          if [ "$days_since" -ge 30 ] || [ ! -f .keepalive ]; then
            now_iso=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            printf '{"lastKeepaliveUtc":"%s","scrapeStatus":"%s","daysSinceLastCommit":%d}\n' \
              "$now_iso" "${{ steps.scrape_step.outputs.scrape_status }}" "$days_since" > .keepalive
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .keepalive
            git commit -m "chore(keepalive): automated schedule heartbeat ${now_iso} [skip ci]" || true
            git pull --rebase origin main || true
            git push origin HEAD:main || true
          fi
